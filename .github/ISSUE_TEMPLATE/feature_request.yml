name: Feature request
description: Suggest a new detection capability, API improvement, or operational feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Per CONTRIBUTING.md, we accept new detection patterns, performance work, operational features, and docs. We do NOT accept new attack payloads with no defensive value.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem or gap. Lead with *why*, not *what*.
      placeholder: "Right now, when a user wants to X, they have to Y. This is painful because Z."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would the scanner behave with this change? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one wins.
