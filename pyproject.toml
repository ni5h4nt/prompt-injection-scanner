[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-injection-scanner"
version = "0.1.0"
description = "Defensive security tool for detecting prompt injection vulnerabilities in AI applications"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["security", "ai", "prompt-injection", "defense", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"

# Core dependencies - minimal for YAGNI
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-ai>=0.0.12",
    "structlog>=23.2.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Vector similarity dependencies
vector-similarity = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

# Vector database clients
vector-chromadb = [
    "chromadb>=0.4.0",
]

vector-pinecone = [
    "pinecone-client>=3.0.0",
]

vector-weaviate = [
    "weaviate-client>=4.4.0",
]

# AI model providers
ai-openai = [
    "openai>=1.3.0",
]

ai-anthropic = [
    "anthropic>=0.7.0",
]

ai-google = [
    "google-generativeai>=0.3.0",
]

# Database support
database = [
    "asyncpg>=0.29.0",  # PostgreSQL
    "redis>=5.0.0",     # Caching
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

# Testing dependencies
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # For testing FastAPI
    "faker>=20.0.0",  # For generating test data
]

# Linting and formatting
lint = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0", 
    "ruff>=0.1.0",
    "bandit>=1.7.0",  # Security linting
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

# All extras combined
all = [
    "prompt-injection-scanner[vector-similarity,vector-chromadb,ai-openai,database,dev]"
]

[project.urls]
Homepage = "https://github.com/your-org/prompt-injection-scanner"
Documentation = "https://your-org.github.io/prompt-injection-scanner"
Repository = "https://github.com/your-org/prompt-injection-scanner"
Issues = "https://github.com/your-org/prompt-injection-scanner/issues"

[project.scripts]
prompt-injection-scanner = "prompt_injection_scanner.cli:cli"
scanner = "prompt_injection_scanner.cli:cli"

[tool.hatchling.build.targets.wheel]
packages = ["src/prompt_injection_scanner"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["prompt_injection_scanner"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "chromadb.*",
    "pinecone.*",
    "weaviate.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # bandit (security)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (allow in tests)
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]