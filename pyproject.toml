[tool.poetry]
name = "prompt-injection-scanner"
version = "0.1.0"
description = "Defensive security tool for detecting prompt injection vulnerabilities in AI applications"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["security", "ai", "prompt-injection", "defense", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "prompt_injection_scanner", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core dependencies
fastapi = ">=0.136.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.35,<1.0"}
pydantic = ">=2.12,<3.0"
pydantic-ai = "^1.99"
structlog = "==25.4.0"
click = "==8.2.1"
pyyaml = "==6.0.2"

# Optional dependencies - Vector similarity
sentence-transformers = {version = ">=2.3.0,<6.0.0", optional = true}
torch = {version = "^2.0.0", optional = true}
numpy = {version = "^1.24.0", optional = true}

# Optional dependencies - Vector databases
chromadb = {version = ">=0.5.0,<2.0.0", optional = true}
pinecone-client = {version = "^3.0.0", optional = true}
weaviate-client = {version = "^4.4.0", optional = true}
pymilvus = {version = "^2.3.0", optional = true}

# Optional dependencies - AI providers
openai = {version = "^2.11.0", optional = true}
anthropic = {version = ">=0.52.0", optional = true}
google-generativeai = {version = ">=0.8.0", optional = true}

# Optional dependencies - Database
asyncpg = {version = "^0.29.0", optional = true}
redis = {version = "^5.0.0", optional = true}
datasets = "^4.0.0"
# Defensive pin: pydantic-ai-slim declares `griffe>=1.14.0` with no upper bound,
# but griffe 2.x removed symbols (e.g. `Docstring`) that pydantic-ai still imports.
# Remove this cap once pydantic-ai's griffe constraint is fixed upstream.
griffe = ">=1.14,<2.0"

[tool.poetry.group.dev.dependencies]
# Development tools
pytest = "^9.0.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
black = "^26.0.0"
isort = "^5.12.0"
mypy = "^1.7.0"
ruff = "^0.1.0"
pre-commit = "^3.5.0"
httpx = "==0.28.1"
faker = "^20.0.0"
bandit = "^1.7.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.4.0"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}

[tool.poetry.extras]
# Vector similarity features
vector-similarity = ["sentence-transformers", "torch", "numpy"]

# Vector database clients
vector-chromadb = ["chromadb"]
vector-pinecone = ["pinecone-client"]
vector-weaviate = ["weaviate-client"]
vector-milvus = ["pymilvus"]

# AI model providers
ai-openai = ["openai"]
ai-anthropic = ["anthropic"]
ai-google = ["google-generativeai"]

# Database support
database = ["asyncpg", "redis"]

# Common combinations
ml = ["sentence-transformers", "torch", "numpy", "chromadb"]
full = [
    "sentence-transformers", "torch", "numpy",
    "chromadb", "pymilvus", "openai", "asyncpg", "redis"
]
all = [
    "sentence-transformers", "torch", "numpy",
    "chromadb", "pinecone-client", "weaviate-client", "pymilvus",
    "openai", "anthropic", "google-generativeai",
    "asyncpg", "redis"
]

[tool.poetry.scripts]
scanner = "prompt_injection_scanner.cli:cli"
prompt-injection-scanner = "prompt_injection_scanner.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Keep all the existing tool configurations
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["prompt_injection_scanner"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "chromadb.*",
    "pinecone.*",
    "weaviate.*",
    "pymilvus.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "N",   # pep8-naming
    "D",   # pydocstyle
    "ANN", # flake8-annotations
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (allow in tests)
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "ANN401", # dynamically typed expressions (Any) disallowed
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101", "S603", "S607", "D", "ANN"]
"src/**/__init__.py" = ["D", "F401"]
"scripts/**/*" = ["D", "ANN"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]